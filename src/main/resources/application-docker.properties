# Docker-specific configuration
# This profile is activated when running in Docker containers

########## Database Configuration ##########
spring.datasource.url=jdbc:mysql://mysql:3306/user_management?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Jakarta&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=yu71
spring.datasource.password=53cret

########## JPA Configuration ##########
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

########## Redis Configuration ##########
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.session.data.redis.namespace=spring:session
# Indexed repository is required to look up sessions by user (active sessions list)
spring.session.data.redis.repository-type=indexed

########## Template Configuration ##########
spring.template.cache=false
spring.thymeleaf.cache=false

########## Secure Token Configuration ##########
jdj.secure.token.validity=28800

########## Base URLs ##########
site.base.url.http=http://localhost:8080
site.base.url.https=https://localhost:8443

########## SMTP Configuration ##########
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dummy
spring.mail.password=123456

########## SSL Configuration ##########
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:hendisantika.p12
server.ssl.key-store-password=123456
server.ssl.key-alias=hendisantika
server.port=8443
http.port=8080

########## Security Configuration ##########
jdj.security.failedlogin.count=2
jdj.brute.force.cache.max=1000

########## Actuator ##########
management.endpoints.web.exposure.include=*
# SMTP credentials are placeholders; keep the container healthcheck independent of an external mail server
management.health.mail.enabled=false

########## Logging ##########
logging.level.com.hendisantika=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

########## Docker Compose Support ##########
# Automatically start docker-compose.yml when running locally
spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml
spring.docker.compose.lifecycle-management=start_and_stop
# Only start the backing services; the "app" service would clash with the locally running app (ports 8080/8443)
spring.docker.compose.start.arguments=mysql,redis
